- id: convoscope
  title: ConvoScope
  summary: 'Convoscope is a resilient, multi-provider AI chat application: it routes conversations
    across OpenAI, Anthropic Claude, and Google Gemini (through `litellm`) and **automatically
    falls back to the next available provider when one has a bad day** — a rate limit, a timeout,
    an outage — so the conversation keeps going instead of dying on an error. It began as
    a single Streamlit script and was refactored into a modular, service-oriented platform
    with a documented architecture, 80 automated tests, and a full MkDocs site. Beyond reliable
    chat, its v2 release added a model-comparison and evaluation workbench for judging provider/model
    pairs side by side. Built with Streamlit over a Python service layer; containerized for
    Docker and Google Cloud Run.'
  design_insight: 'The unifying idea is **designing for the failure case as the normal case**.
    A chat app that assumes the model always answers is a demo; treating provider outages,
    rate limits, and timeouts as expected events — and building routing, backoff, and fallback
    around them — is what makes it a system. The same instinct shows up in the evaluation
    workbench: rather than trusting a single model''s output or a gut impression, it forces
    a blind, multi-criteria comparison and records the cost/latency tradeoffs, so "which model
    is better here" becomes an answerable question instead of a vibe. And by keeping the monolith→modular
    refactor legible in the repo, the project argues that reliability and maintainability
    are themselves features worth documenting.'
  walkthrough_context: "Two projects living in one, honestly. The first is a **reliability\
    \ story**: most \"LLM chat app\" demos assume the API always answers, and Convoscope is\
    \ built around the opposite assumption — providers fail, so treat fallback, retry-with-backoff,\
    \ and graceful degradation as first-class features rather than afterthoughts. The second\
    \ is a **refactoring story told in public**: the repo deliberately preserves the arc from\
    \ a monolithic `run_chat.py` prototype to a modular architecture (service, utility, and\
    \ experiments layers), documented with technical decision records, diagrams, before/after\
    \ metrics, and a visual gallery — so a reader can see *how* the system got to production-shaped,\
    \ not just the finished state.\n\n```\nChat request       Streamlit UI collects the prompt\
    \ + session state\n   │               (provider choice, temperature, token limits, system\
    \ prompt)\n   ▼\nRoute + fallback   LLM service tries the selected provider via litellm;\
    \ on\n   │               failure it retries with exponential backoff, then falls\n   │\
    \               back to the next provider whose API key is configured —\n   │        \
    \       so a single provider outage doesn't end the conversation\n   ▼\nPersist      \
    \      Conversation Manager saves/loads/exports history with\n   │               atomic\
    \ file writes and automatic backups; topic\n   │               summaries and styled HTML\
    \ export round out the record\n   ▼\nCompare (v2)       an evaluation workbench runs the\
    \ same prompt across 2–4\n                   provider/model pairs, presents blind A/B/C\
    \ responses for\n                   5-point scoring (correctness, usefulness, clarity,\
    \ safety,\n                   overall), and logs latency, token counts, and estimated\n\
    \                   cost to an append-only JSONL results store\n```\n\n| Layer | Technology\
    \ | Notes |\n|---|---|---|\n| UI | Streamlit (three tabs: Chat, Compare, Results) | Session-state\
    \ driven; CSS-variable theming, responsive design |\n| Service layer | `src/services/`\
    \ — LLM service + Conversation Manager | Provider routing/fallback and persistence extracted\
    \ out of the original single-file script into testable modules |\n| Provider routing |\
    \ `litellm` over OpenAI, Anthropic, Google Gemini | Key-based availability detection;\
    \ retry with exponential backoff |\n| Evaluation | `src/experiments/` — compare, metrics,\
    \ io | Blind side-by-side scoring; latency/token/cost metrics; JSONL logging; pricing\
    \ + prompt config in `experiments/*.yaml` |\n| Persistence | Local file storage + auto-backups\
    \ | Atomic writes, data-integrity checks, HTML/topic-summary export |\n| Testing & docs\
    \ | pytest + Playwright (80 tests: 56 unit, 24 integration); MkDocs Material | End-to-end\
    \ UI coverage; TDRs, diagrams, visual asset index |\n\nActively developed; the changelog\
    \ runs from a November 2024 prototype (v0.1.0) through the October 2025 v2.0.0 comparison\
    \ release. Deployment is self-hosted — Docker and Google Cloud Run configs ship with the\
    \ repo, but availability of any given instance varies. Honest limits: it's a single-user\
    \ application with file-based (not multi-tenant database) persistence; provider fallback\
    \ depends on which API keys you've configured, so reliability degrades to whatever providers\
    \ you've actually set up; and the evaluation rubric is a deliberate human-judgment tool,\
    \ not an automated benchmark."
