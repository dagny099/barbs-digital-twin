- id: beehive-monitor
  title: Beehive Monitor
  summary: The Beehive Photo Metadata Tracker is an AI-powered beekeeping management system
    that turns unstructured hive-inspection photos into a structured, searchable knowledge
    base, built on 4+ years of Barbara's own backyard-beekeeping data. A multi-page Streamlit
    app extracts EXIF metadata (three-library fallback), runs Google Cloud Vision analysis
    on hive photos, correlates each inspection with historical weather (Open-Meteo, GPS-validated),
    and performs bee-domain color-palette analysis for honeycomb health indicators. Version
    0.1.0 adds a four-step bulk-import wizard (S3, local directories, or URLs), a storage
    abstraction layer with a fully implemented AWS S3 provider, and an 80%-coverage pytest
    suite. Deployed via Docker on Google Cloud Run; live at beestory.barbhs.com.
  design_insight: 'This is what building tools for problems you actually have looks like:
    domain knowledge shapes every technical choice, from agricultural confidence thresholds
    on the Vision API to comb-color clustering as a health signal. It also demonstrates unglamorous
    production engineering — a storage abstraction that earns its keep (the S3 provider went
    from "ready" to fully implemented), bulk import for the backlog every real beekeeper has,
    and a test suite that mocks two external APIs — applied to a dataset of personal significance.'
  walkthrough_context: "A real AI project for a problem Barbara genuinely lives with — not\
    \ a benchmark dataset. Beekeepers accumulate thousands of inspection photos but lack tools\
    \ to track hive health over time, correlate visual observations with environmental conditions,\
    \ or search their own history. This app closes that loop: every photo becomes a structured\
    \ record (when, where, what the camera saw, what the weather was, what colors the comb\
    \ showed), and the record becomes a timeline you can reason about.\n\n```\nCapture / Import\
    \   single-photo upload, or the 4-step bulk-import wizard\n   │               (S3 buckets,\
    \ local directories, URLs; photos auto-grouped\n   │               into inspections by\
    \ date; staged progress + error reporting)\n   ▼\nExtract            EXIF metadata via\
    \ three-library fallback (PIL, exifread,\n   │               pyexiftool) for broad camera\
    \ compatibility; GPS coordinates\n   │               parsed and validated before any weather\
    \ lookup\n   ▼\nAnalyze            Google Cloud Vision detects bees/hive components (custom\n\
    \   │               confidence thresholds for the agricultural domain);\n   │        \
    \       ColorThief palette analysis for honeycomb health indicators;\n   │           \
    \    Open-Meteo supplies temperature/humidity/wind for the date+location\n   ▼\nStore\
    \              JSON persistence with auto-save, timestamped backups, and\n   │       \
    \        auto-load of the latest backup on refresh; CSV export;\n   │               storage\
    \ abstraction (local ✓, AWS S3 ✓ full CRUD, GCS-ready)\n   ▼\nExplore            interactive\
    \ Plotly timeline, calendar view, photo gallery,\n                   and an annotation\
    \ system for beekeeper observations\n```\n\nMulti-page Streamlit app (native navigation,\
    \ centralized session-state management, authentication) over a layered design: UI → processing\
    \ (image analysis, metadata) → external APIs (Cloud Vision, Open-Meteo) → pluggable storage.\
    \ The storage layer uses a provider pattern with runtime switching, a guided setup wizard,\
    \ health checks, and a usage/cost analytics dashboard.\n\n| Layer | Technology | Notes\
    \ |\n|---|---|---|\n| UI | Streamlit (multi-page) + Plotly | Timeline, calendar, gallery\
    \ views; custom honey-themed styling with dark/light mode |\n| Image processing | PIL,\
    \ exifread, pyexiftool, ColorThief | Three-library EXIF fallback; domain-specific color\
    \ clustering |\n| Computer vision | Google Cloud Vision API | Bee/hive object detection\
    \ with tuned confidence thresholds |\n| Weather | Open-Meteo API | Historical lookup keyed\
    \ to GPS-validated photo coordinates |\n| Storage | JSON/CSV + provider abstraction |\
    \ Local and AWS S3 (signed URLs, thumbnails) implemented; GCS-ready |\n| Testing | pytest\
    \ (80% min coverage) | Unit/integration/system tiers; mocked Vision + weather fixtures;\
    \ device-coverage EXIF tests |\n| Deployment | Docker (multi-stage) → Cloud Run | `deploy.sh`\
    \ automation; health checks |\n| Docs | MkDocs Material, dual-audience | Separate engineering\
    \ site and portfolio site from one codebase |\n\nv0.1.0 (October 2025) is the first stable\
    \ release, consolidating March–October 2025 development; the demo at beestory.barbhs.com\
    \ is live. Roadmap: analytics dashboard with hive-health scoring (0.2.0), enhanced vision\
    \ models — varroa mite detection, queen identification, brood-pattern analysis (0.3.0),\
    \ and integrations like hive-scale correlation (0.4.0)."
