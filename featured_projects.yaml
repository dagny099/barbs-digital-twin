- id: digital-twin
  title: Digital Twin
  summary: 'Barbara''s Digital Twin is a conversational AI that answers questions about Barbara
    Hidalgo-Sotelo in her own first-person voice, grounded in her actual writing and work
    history through retrieval-augmented generation (RAG). It is itself a portfolio piece —
    an engineered retrieval system, not a wrapper around an LLM. The retrieval layer is dual-backend
    from a single codebase, selected per deployment via `RETRIEVAL_BACKEND`: a **ChromaDB**
    pure-vector store is the live production backend at twin.barbhs.com, while a **Neo4j GraphRAG**
    backend (hybrid vector-plus-graph reranking) runs on the `graphy.` preview and is being
    validated before it can take over production. Built with Gradio, OpenAI embeddings, and
    LiteLLM multi-provider completions, it adds passphrase-based sensitivity tiers, project
    walkthroughs with served diagrams, Pushover tool-calling, per-query cost logging, and
    a zero-config cold-start that restores the vector DB from a private Hugging Face Hub dataset.
    Self-hosted on AWS EC2.'
  design_insight: 'Two lessons shaped how the twin actually sounds and stays grounded. First:
    retrieval quality depends more on *how the knowledge base is written* than on the embedding
    model — several documents were authored specifically for how their chunks would be queried
    (a philosophy doc, a positioning doc, a career narrative), designed around retrieval rather
    than as prose to read top to bottom. Second: the model and the system prompt, not the
    retrieval stack alone, are what make the twin sound like Barbara. The same content answered
    through a fast model like Gemini Flash versus a frontier model like GPT-4.1 diverges noticeably
    in register, so the production model is chosen deliberately for a consistent persona —
    LiteLLM keeps that a one-line change. And the system prompt is the primary steering instrument:
    it sets voice, framing, source priority, and explicit failure modes, and doubles as the
    guardrail that keeps answers in-scope and on-persona. Enough of the design lives there
    that it''s treated as part of the app''s safety surface, not published in detail.'
  walkthrough_context: "A conversational front door to Barbara's work: visitors ask questions\
    \ and get answers in her voice, grounded in a curated knowledge base rather than the model's\
    \ parametric memory. It is the flagship of the portfolio and a working demonstration of\
    \ production-RAG craft — the knowledge base is authored *for retrieval*, the retrieval\
    \ is measured, and the same codebase runs two retrieval backends side by side so their\
    \ behavior can be compared honestly rather than asserted. The twin's own featured-project\
    \ answers (walkthroughs, diagrams, design insights) are derived from the same consolidated\
    \ project summaries this file belongs to, so the twin describes each project from one\
    \ authoritative source.\n\n```\nVisitor question\n   │              audience-tier detection\
    \ scans the full conversation history\n   ▼              for passphrases (public / personal\
    \ / inner_circle)\nEmbed             OpenAI text-embedding-3-small (1536-dim), shared\
    \ by both backends\n   │\nRetrieve          RETRIEVAL_BACKEND selects the store:\n   │\
    \                • ChromaDB — pure vector search (LIVE production backend)\n   │     \
    \           • Neo4j GraphRAG — vector similarity reranked by graph bonuses\n   │     \
    \             (in validation on the graphy. preview)\n   │              tier gating restricts\
    \ which sections are eligible before ranking\n   ▼\nAssemble          system prompt +\
    \ retrieved context; when a visitor names a featured\n   │              project, a separate\
    \ walkthrough block is injected (RAG stays grounded\n   │              in the actual question)\n\
    \   ▼\nGenerate          LiteLLM streamed completion (default gpt-4.1; OpenAI / Anthropic\
    \ /\n   │              Google / local Ollama), with optional tool calls (Pushover, dice)\n\
    \   ▼\nRespond           first-person reply, plus the project diagram when a project is\n\
    \   │              prominent in the answer\n   ▼\nLog               JSONL query log (model,\
    \ cost, retrieval scores, tier, owner flag)\n                  and thumbs-up/down vote\
    \ capture\n```\n\nOne codebase, two retrieval backends, chosen at runtime by the `RETRIEVAL_BACKEND`\
    \ env var so each deployment can run either without a code change. The **ChromaDB** backend\
    \ (a persistent local store, collection `barb-twin`) performs pure vector search and is\
    \ the current production backend serving twin.barbhs.com. The **Neo4j GraphRAG** backend\
    \ embeds sections as graph nodes and reranks vector results with small graph-signal bonuses\
    \ — for project-linked sections, entity mentions, and section length — that act as tiebreakers\
    \ rather than determiners; it runs on the `graphy.` preview and is being validated toward\
    \ taking over production, with the exact reranking scheme still being tuned as part of\
    \ that evaluation. Both backends share the same OpenAI `text-embedding-3-small` embeddings\
    \ and the same sensitivity-tier gating. The knowledge base is a curated multi-document\
    \ corpus (biosketch, positioning and philosophy docs, career narrative, publications,\
    \ and the consolidated project summaries and walkthroughs) chunked by `##` header boundaries,\
    \ with source, section, and sensitivity metadata on every chunk. A private Hugging Face\
    \ Hub dataset holds the embedded ChromaDB state and doubles as the cold-start transport:\
    \ on startup, if the local store is missing, the app pulls and extracts it automatically.\n\
    \n| Layer | Technology | Notes |\n|---|---|---|\n| UI | Gradio `ChatInterface` | Custom\
    \ CSS (IBM Plex Sans, warm/teal palette, dark mode); streamed replies; project diagrams\
    \ served by URL |\n| Embeddings | OpenAI `text-embedding-3-small` | 1536-dim; used at\
    \ ingest and query time by both backends |\n| Vector backend | ChromaDB (persistent) |\
    \ Collection `barb-twin`; pure vector search; **live production backend** at twin.barbhs.com\
    \ |\n| Graph backend | Neo4j (Aura) GraphRAG | `section_embeddings` vector index + graph-signal\
    \ reranking (still being tuned); **in validation** on the `graphy.` preview |\n| LLM completions\
    \ | LiteLLM (multi-provider) | Default `gpt-4.1`; OpenAI / Anthropic / Google / Ollama;\
    \ tool calling where supported |\n| Tools | Function calling | `send_notification` (Pushover\
    \ to Barbara), `dice_roll` (pipeline demo) |\n| DB store & sync | Hugging Face Hub dataset\
    \ | Canonical embedded-state store + zero-config cold-start pull |\n| Deployment | Self-hosted\
    \ (AWS EC2) | Runs on a persistent EC2 instance; a Hugging Face Spaces mirror also exists\
    \ |\n| Logging | JSONL query log | Per-query model, cost, retrieval scores, tier, tool\
    \ calls, thumbs vote, owner flag |\n\nLive and production-solid: the ChromaDB vector backend\
    \ serving twin.barbhs.com, the three-tier sensitivity gating, project walkthroughs with\
    \ served diagrams, Pushover tool-calling, per-query cost and retrieval logging, and the\
    \ zero-config Hugging Face Hub cold-start. In validation, not yet promoted: the Neo4j\
    \ GraphRAG backend, which runs on the `graphy.` preview — its refresh is a full graph\
    \ wipe-and-rebuild, and it is being compared against the vector backend before any switchover.\
    \ Honest limits: the sensitivity tiers are a content-appropriateness gate, not security\
    \ — detection is a case-insensitive substring match over the conversation, and the failure\
    \ mode (a determined guesser sees more personal content) is deliberately low-stakes. The\
    \ knowledge base content is private and not committed, so a fresh clone of the repo has\
    \ no chunks to retrieve until pointed at its own content."
  diagram_filename: architecture-overview_barb_twin.png
  diagram_caption: Digital Twin — knowledge graph construction → hybrid retrieval → response
    generation
