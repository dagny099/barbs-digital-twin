- id: concept-cartographer
  title: Concept Cartographer
  summary: 'A Gradio app that makes implicit knowledge structure explicit: as you chat, it
    extracts concepts and relationships from each turn and builds a persistent, growing knowledge
    graph you can explore and export. A compact demonstration of stateful LLM tooling that
    externalizes reasoning structure rather than just generating text.'
  design_insight: The architectural decision worth noting is the single-call design — one
    LLM call per turn returns both a conversational response and structured JSON simultaneously,
    rather than a separate extraction step. This is ~50% faster and cheaper than a two-call
    approach. Above 30 nodes, a connectivity filter keeps the graph coherent by only admitting
    concepts that connect to existing ones.
  walkthrough_context: 'Concept Cartographer is a Gradio app that turns a conversation into
    a growing knowledge graph. As you chat, it extracts concepts and relationships and renders
    them as a color-coded, persistent map you can export. The key architectural decision is
    the single-call design: (1) Ask — Pick a domain lens (AI/ML, Cognitive Science, Philosophy,
    Biology, or more) and ask a question through the Gradio interface. Domain selection nudges
    extraction toward domain-relevant concepts and relation types. (2) Extract — A single
    LLM call (GPT-4o-mini) returns both a conversational narrative and a structured JSON ontology
    (concepts with categories like Entity, Process, Theory, Method, Property, plus relationship
    triples with typed edges like causes, requires, enables). This is ~50% faster and cheaper
    than a two-call approach that separates chat from extraction. (3) Build — The graph accumulates
    across conversation turns with a color-coded legend by concept category. Above 30 nodes,
    a connectivity filter ensures only concepts that connect to existing nodes are admitted
    — preventing disconnected islands and keeping the map coherent. A ''Latest Connections''
    panel below the chat shows a plain-language summary of what was just extracted. (4) Export
    — The current graph state exports as JSON (for downstream tools like Neo4j, Obsidian,
    or presentations) or PNG (for sharing). Stack: Python, Gradio, OpenAI API (GPT-4o-mini),
    NetworkX, Matplotlib.'
  diagram_filename: architecture-diagram_concept_cartography.png
  diagram_caption: Concept Cartographer — question → single LLM call → growing knowledge graph
    → export
