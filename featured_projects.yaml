- id: poolula-platform
  title: Poolula Platform
  summary: 'The Poolula Platform is an AI-powered "LLC Operating System" for a property-holding
    business, unifying structured data, document management, and a RAG chatbot behind a FastAPI
    REST API — with a built-in evaluation harness as a first-class component. Five SQLModel
    tables (Properties, Transactions, Documents, Obligations, immutable Audit Log) hold the
    business facts with full provenance; PDFs are classified, hash-deduplicated, and embedded
    into ChromaDB for semantic search; and a provider-agnostic chatbot (Anthropic Claude by
    default, OpenAI, or local Ollama) answers business questions using tool calls against
    both stores. Quality is measured, not assumed: two specialized evaluators — including
    one validated against CSV ground truth with 1% numerical tolerance — score every capability
    with a ≥90% target, runnable offline via recorded fixtures. Current work integrates DSPy
    pipeline optimization with MLflow experiment tracking.'
  design_insight: 'The evaluation harness is central rather than incidental: provider comparisons,
    regression checks after refactors, and numerical ground-truth validation all hang off
    it. Two other choices worth noting: mutations flow through an immutable audit log (business
    data you can trust later), and the provider factory keeps the platform model-agnostic
    rather than coupling to one vendor.'
  walkthrough_context: "A unified management platform for Poolula LLC — a turnkey, always-ready\
    \ structure for small property-holding businesses. Instead of a spreadsheet, a folder\
    \ of PDFs, and memory, the LLC's state lives in one system: structured records with an\
    \ audit trail, searchable documents, and a chatbot that can answer \"what did we spend\
    \ on repairs last year?\" by querying the database or \"what does the lease say about\
    \ renewals?\" by searching documents — citing its sources either way.\n\n```\nUser question\
    \ / API call\n   │\n   ▼\nFastAPI REST API ──────────────  full CRUD for properties, transactions,\n\
    \   │                             obligations, documents; document upload +\n   │    \
    \                         processing pipeline; mutations recorded to\n   │           \
    \                  an immutable audit_log table\n   ▼\nRAG system (tool router)\n   ├──\
    \ query_database ────────── SELECT-only SQL against SQLite (SQLModel;\n   │          \
    \                   Alembic migrations; PostgreSQL-ready)\n   ├── search_document_content\
    \ ─ semantic search over ChromaDB embeddings\n   └── list_business_documents ─ document\
    \ metadata browsing\n   │\n   ▼\nLLM provider factory ─────────── Anthropic Claude (default)\
    \ / OpenAI / Ollama,\n   │                             selected via LLM_PROVIDER env var\n\
    \   ▼\nAnswer + source citations ────── conversation history, session management,\n  \
    \ │                             audit logging on every interaction\n   ▼\nEvaluation harness\
    \ ───────────── scores the whole loop (see below)\n```\n\n| Layer | Technology | Notes\
    \ |\n|---|---|---|\n| API | FastAPI + SQLModel + Alembic | Python 3.13, `uv` dependency\
    \ management |\n| Structured data | SQLite (PostgreSQL-ready) | 5 core tables, provenance\
    \ tracking, immutable audit log |\n| Documents | ChromaDB + SHA-256 dedup | PDF upload\
    \ → classify (Agreement, Filing, Insurance, Lease) → chunk → embed |\n| Chatbot | Provider\
    \ factory: Anthropic / OpenAI / Ollama | Tool-calling RAG; SELECT-only SQL guard; citations\
    \ |\n| Evaluation | Shared harness + fixture backends | Offline, credential-free eval\
    \ runs; Markdown failure reports |\n| Optimization | DSPy + MLflow (in progress) | Experiment\
    \ tracking; pipeline vs baseline comparison |\n\nActively developed; Phase 4 (API completion\
    \ & platform hardening) landed July 2026 — full REST routes, working document pipeline,\
    \ 156 tests with coverage rising (40% → 54%). In progress: true DSPy pipeline modules\
    \ (current implementation wraps the RAG system) with MLflow tracking. A new demo mode\
    \ ships a complete fictional persona — an isolated demo database and ChromaDB vector store\
    \ seeded from committed sample data — so the platform can be shown publicly (interviews,\
    \ client demos, screen recordings) without touching the real client data. Known limits:\
    \ single-user design with no API authentication yet; evaluation datasets are intentionally\
    \ small (expanding toward 40+ questions); internal prototype, not licensed for distribution."
