- id: weaving-memories
  title: Weaving Memories Into Graphs
  summary: A memorial knowledge graph preserving the professional legacy of Barbara's late
    father, Domingo Hidalgo Lopez — a software developer and naval architect whose systems
    still run in semiconductor fabs worldwide. It proves you can apply rigorous knowledge
    engineering to something deeply personal.
  design_insight: This project bridges rigorous knowledge engineering methodology with deeply
    personal subject matter. Every fact has provenance tracking (source + confidence), and
    a semi-automated Wikidata enrichment pipeline adds external context — showing that KG
    best practices aren't just for enterprise data.
  walkthrough_context: 'Weaving Memories Into Graphs is a memorial project for Barbara''s
    late father, Domingo Hidalgo Lopez — a software developer and naval architect whose systems
    still run in semiconductor fabs worldwide. The system works like this: (1) Schema Design
    — A 14-entity Neo4j schema (Person, Organization, Position, Education, Location, Project,
    Technology, Skill, Patent, Product, Event, Artifact, Publication, Industry) with temporal
    relationship patterns. (2) Extraction — Claude extracts structured YAML from biographical
    text, validated against Pydantic dataclasses. (3) Enrichment — A semi-automated tool queries
    Wikidata for external context, with provenance tracking so every fact has a source. (4)
    Frontend — A React + Vite app with timeline, legacy, and network views served by a Flask
    REST API. Stack: Python, Neo4j Aura, Claude, Flask, React + Vite, Wikidata API.'
  diagram_filename: weaving_memories_diagram.png
