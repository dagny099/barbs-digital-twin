- id: fitness-tracker
  title: Fitness Tracker
  summary: 'The Fitness Dashboard is a personal analytics platform built on Barbara''s own
    workout history — thousands of sessions spanning June 2013 to the present, exported from
    MapMyRun and continuously updated — and it has grown from a visualization dashboard into
    a small, honest ML system. A Streamlit app over MySQL re-derives what each workout actually
    was: in the repo''s shipped sample dataset, the source app had tagged 2,665 of ~2,800
    workouts simply "Run," even long dog-walks, so k-means clustering on pace, distance, and
    duration re-classifies them into `real_run`, `pup_walk`, `mixed`, or `outlier` — with
    confidence scores, plain-language explanations, model versioning, and a full audit history
    behind every decision. Six views cover daily AI insights, monthly calendars, trends, "The
    Choco Effect" behavior analysis, model management, and a SQL console. Live (behind a login)
    at workouts.barbhs.com.'
  design_insight: 'Two habits of mind show up here. First, **skepticism toward source data**:
    the app''s single most valuable move is refusing to trust the fitness app''s labels (2,665
    of 2,800 workouts tagged "Run") and re-deriving categories from measured behavior. Second,
    **trust machinery scaled to a personal project**: versioned models, an audit trail, confidence
    scores, and user-feedback correction for a k-means classifier is deliberately "overkill"
    — the point is that any ML system that affects decisions owes its users traceability and
    honest uncertainty, and a personal dashboard is a fine place to demonstrate the full discipline,
    including the rare one: declining to quote an accuracy number that no ground truth exists
    to support.'
  walkthrough_context: "An answer to the question \"what does a decade-plus of personal data\
    \ actually tell you?\" — asked with real statistical honesty. Long-horizon data reveals\
    \ what short windows can't: seasonal rhythms, slow drifts, and life-event effects. The\
    \ signature example is **The Choco Effect**: after Barbara adopted her dog Choco in mid-2018,\
    \ daily activity shifted from running toward dog-walking — a shift so structural that\
    \ the classifier uses the adoption date (a configurable cutoff, default June 1, 2018)\
    \ as its era-based fallback when a workout's numbers alone can't decide. The project treats\
    \ its own limits as content: classification is unsupervised, so there is deliberately\
    \ **no claimed accuracy percentage** — instead, every result carries a confidence score,\
    \ an explanation, and an audit trail, and can be corrected through user feedback.\n\n\
    ```\nImport             MapMyRun CSV export → validation checks → MySQL\n   │        \
    \       (a real multi-year sample dataset ships with the repo,\n   │               so\
    \ the app works out of the box; Barbara's live instance\n   │               stays current\
    \ with fresh imports)\n   ▼\nClassify           k-means clustering on pace/distance/duration\
    \ sorts each\n   │               workout into real_run / pup_walk / mixed / outlier;\n\
    \   │               rule-based + era-based fallbacks (the Choco cutoff) cover\n   │  \
    \             sparse data; every decision gets a confidence score and\n   │          \
    \     a human-readable explanation\n   ▼\nGovern             model versioning + registry\
    \ with lineage tracking,\n   │               classification audit history, activation\
    \ management,\n   │               and user feedback collection for corrections\n   ▼\n\
    Analyze            statistical trend detection with confidence intervals,\n   │      \
    \         multi-dimensional consistency scoring (frequency, timing,\n   │            \
    \   performance, streaks), IQR/z-score outlier flagging\n   ▼\nExplore            six\
    \ Streamlit views: AI Intelligence (daily insights),\n                   monthly calendar,\
    \ trends, The Choco Effect, model\n                   management, and a SQL console; plus\
    \ route mapping\n```\n\n| Layer | Technology | Notes |\n|---|---|---|\n| UI | Streamlit\
    \ (six views) + Plotly | AI Intelligence, Monthly, Trends, Choco Effect, Model Management,\
    \ SQL console; route mapping |\n| Storage | MySQL | Environment-aware config: local MySQL\
    \ in development, AWS RDS in production |\n| ML / statistics | scikit-learn (k-means),\
    \ SciPy | Unsupervised classification + trend analysis with confidence intervals |\n|\
    \ Model governance | Versioning, registry, lineage, audit service | Every classification\
    \ traceable; user feedback loop for corrections |\n| Data import | CSV (MapMyRun-shaped)\
    \ | Validation on import; other formats need light mapping |\n| Testing & docs | pytest\
    \ (139 test methods, 12 files); dual MkDocs sites | Public user guide + developer internals\
    \ |\n\nLive and actively maintained — v0.1.0 (October 2025) consolidated the audit-history\
    \ and model-versioning systems, and a 2026 documentation sweep brought all claims in line\
    \ with reality. Limits, stated the way the project itself states them: it's a single-user\
    \ personal tool tuned to one long personal history (defaults like the Choco cutoff won't\
    \ fit someone else automatically); classification is unsupervised with no formal accuracy\
    \ figure; setup requires your own MySQL and some command-line comfort; import is MapMyRun-shaped."
