- id: academic-citation-platform
  title: Academic Citation Platform
  summary: ML-powered research discovery using TransE knowledge graph embeddings trained on
    12K+ academic papers. Predicts which papers are likely to cite each other by learning
    citation relationships as vector translations in embedding space.
  design_insight: The TransE model was implemented from scratch rather than using a library
    — a deliberate choice to understand the embedding geometry deeply. A 4-notebook research
    pipeline tells the complete data science story from exploration to presentation, mirroring
    how Barbara approaches analytical projects.
  walkthrough_context: 'Academic Citation Platform predicts which papers are likely to cite
    each other using knowledge graph embeddings. The pipeline works in four stages: (1) Import
    — Papers are ingested from the Semantic Scholar API with streaming batch processing (25x
    faster), quality filtering by citation count and year range, and file upload for custom
    collections. (2) Train — A TransE model (implemented from scratch) learns citation relationships
    as vector translations in embedding space, with early stopping and training visualizations.
    (3) Predict — The trained model generates 1000+ novel citation predictions with confidence
    scores, evaluated via MRR, Hits@K, and AUC. (4) Explore — An interactive Streamlit dashboard
    with clickable network graphs, community detection (multiple algorithms), temporal trend
    analysis, and export to LaTeX tables and high-res graphics. A 4-notebook research pipeline
    tells the complete data science story from exploration to presentation. Stack: Python,
    Neo4j, Streamlit, TransE, Semantic Scholar API, NetworkX.'
  diagram_filename: academic_citation_platform_diagram.png
  diagram_caption: Academic Citation Platform — papers → TransE training → citation prediction
    → interactive analysis
