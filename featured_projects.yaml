projects:
- id: resume-graph-explorer
  title: Resume Graph Explorer
  summary: Transforms a flat resume into an interactive, navigable knowledge graph built on
    established semantic standards (SKOS, ESCO, schema.org). Skills form hierarchies using
    SKOS broader/narrower relations, so the graph captures not just what someone knows but
    how those skills relate.
  design_insight: The distinctive choice here is grounding applied AI work in existing standards
    rather than inventing a bespoke schema. The graph uses six entity types validated with
    SHACL constraints and mapped to the ESCO European skills taxonomy — making the output
    interoperable, not just pretty.
  walkthrough_context: 'Resume Graph Explorer turns a flat resume into a living knowledge
    graph. The pipeline works in three stages: (1) Extract — An LLM (Claude, OpenAI, or Ollama)
    reads the resume and pulls out structured entities: skills, roles, organizations, industries.
    Six entity types total: Person, Job, Skill, Education, Certification, Organization, connected
    by typed relationships. (2) Normalize — A three-phase pipeline maps those entities to
    the ESCO European skills taxonomy, resolving synonyms and aligning to a hybrid SKOS vocabulary
    (SKOS Core + ESCO + schema.org + a custom resume namespace). SHACL constraints validate
    every triple before it enters the graph. (3) Visualize — The result is an interactive
    graph (Vis.js) you can explore in the browser, query with SPARQL, or export as Turtle/RDF/JSON-LD.
    It also generates two narrative career stories from the graph structure — one conservative
    (what the evidence clearly supports) and one exploratory (what the patterns suggest).
    Stack: Python, Flask, React 18, rdflib, NetworkX, Vis.js.'
  diagram_filename: resume_graph_explorer_diagram.png
  diagram_caption: Resume Graph Explorer — extraction → normalization → interactive graph
