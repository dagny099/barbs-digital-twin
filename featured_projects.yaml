projects:
- id: resume-graph-explorer
  title: Resume Graph Explorer
  summary: 'Resume Graph Explorer turns a résumé into a knowledge graph you can inspect, validate,
    query, and build on. It extracts entities from a résumé document with an LLM — Claude,
    OpenAI, or a local Ollama model, provider-agnostic with fallback — and assembles them
    into an RDF graph aligned to open standards: **SKOS** for concepts, **schema.org** for
    entity types, and the European **ESCO** taxonomy for skills. You explore the result as
    an interactive Vis.js network graph, export it as Turtle / RDF-XML / JSON-LD, run a semantic-integrity
    check before you trust it, and feed it through an offline analysis pipeline that turns
    graph structure into natural-language career insights. It''s a full-stack app (Flask +
    React), and the insight documents it produces are deliberately written to be embeddable
    as grounded memory for a RAG system.'
  design_insight: 'The signature choice is **grounding applied-AI output in existing standards
    instead of inventing a schema**. It would have been faster to emit a bespoke JSON shape,
    but the graph commits to SKOS + ESCO + schema.org, so the result is interoperable — it
    means something outside this one app — and skills carry real hierarchy (broader/narrower)
    rather than being a flat tag cloud.


    The second thread is **letting the human overrule the model, permanently**. Any node label
    can be corrected right in the graph, and once an edit is marked `user_verified` it is
    protected from later normalizer rewrites and becomes a canonical anchor that future uploads
    resolve against. The correction isn''t a one-off patch on a throwaway output — it''s durable
    ground truth that constrains the automation going forward, which is the right relationship
    between a person and an extraction pipeline they don''t yet fully trust.


    The third is **one graph, many faces**. The interactive visualization, the statistics,
    all three RDF export formats, and the offline analysis pipeline read from a single graph-building
    code path — so what you see on screen is provably what you export and what gets analyzed,
    with no second, drifting representation to keep in sync. Extraction is the easy part;
    making one honest, standards-aligned graph *mean the same thing* to humans and machines
    alike is the point.'
  walkthrough_context: "The premise is that a résumé is a flat story but a career has structure\
    \ — skills that bridge chapters, capabilities evidenced but never listed, toolkits that\
    \ drift over time. A résumé says what you did; the graph shows how it connects, and says\
    \ so in open standards rather than a bespoke schema. Six entity types (Person, Job, Skill,\
    \ Education, Certification, Organization) become SKOS-compliant nodes linked by typed\
    \ relationships, with skills placed in SKOS broader/narrower hierarchies and mapped against\
    \ ESCO. Because the export, the graph view, the stats, and the analysis pipeline all share\
    \ one graph-building code path, the Turtle / RDF-XML / JSON-LD you download carries the\
    \ same complete semantics as the picture on screen — it drops into any triplestore or\
    \ SPARQL tooling. What it deliberately is *not* yet: a full SHACL validator (the integrity\
    \ checker is a pragmatic, hand-tuned set of checks), or a benchmarked extractor (the evaluation\
    \ harness is an honest scaffold, not a leaderboard).\n\n```\nUpload           drop a résumé\
    \ (PDF / DOCX / TXT / MD) into a session; multiple\n   │             documents per session\
    \ dedupe into one graph, cached so nothing\n   │             re-extracts, with live WebSocket\
    \ progress\n   ▼\nExtract          a provider-agnostic LLM (Claude / OpenAI / Ollama,\
    \ with fallback)\n   │             reads the text into six SKOS entity types; an optional,\
    \ off-by-\n   │             default DSPy route exists for structured-extraction research\n\
    \   ▼\nNormalize        an entity normalizer resolves aliases (\"ML\" ⇒ \"machine learning\"\
    ),\n   │             strips org suffixes (\"Acme Corp, Inc.\" = \"Acme Corp\"), keeps\
    \ user-\n   │             verified labels canonical, and records variants as skos:altLabel;\n\
    \   │             skills are matched to the ESCO taxonomy via its live REST API\n   ▼\n\
    Graph + check    rdflib builds the RDF graph; a NetworkX adapter renders it to Vis.js;\n\
    \   │             a lightweight validator flags dangling refs, missing labels, and\n \
    \  │             near-duplicate skills (pragmatic checks, not full SHACL)\n   ▼\nExplore/export\
    \   interactive graph in the browser; export Turtle / RDF-XML / JSON-LD\n   │        \
    \     (identical semantics via the shared code path)\n   ▼\nAnalyze          an offline\
    \ pipeline runs 6 structural analyses and synthesizes two\n                 career narratives\
    \ (conservative + exploratory) — markdown written\n                 for embedding as grounded\
    \ RAG memory (e.g. a vector store like ChromaDB)\n```\n\n| Layer | Technology | Notes\
    \ |\n|---|---|---|\n| Frontend | React 18 · Vite · Vis.js · Socket.IO | 11 components;\
    \ physics-layout network graph, entity panel with inline editable labels, insights + narratives\
    \ tabs |\n| Backend | Python 3.10+ · Flask · Flask-SocketIO | REST API + WebSocket streaming;\
    \ disk-backed session store surviving restarts |\n| LLM layer | `llm_client` abstraction\
    \ | Claude / OpenAI / Ollama, provider-agnostic with fallback; model registry (`models.yaml`)\
    \ validated at startup so a bad model id fails fast, not mid-extraction |\n| Extraction\
    \ | `resume_extractor` (+ optional `extraction_dspy`) | Résumé text → six SKOS entity\
    \ types; DSPy route experimental, off by default (threading issues) |\n| Normalization\
    \ | `entity_normalizer` (in-session + offline tool) | Alias resolution, org-suffix dedup,\
    \ similarity job-dedup, `user_verified` anchoring, `skos:altLabel` provenance |\n| Semantic\
    \ layer | rdflib · SKOS · ESCO (REST) · schema.org | Skills mapped to ESCO v1.2.1 at analysis\
    \ time (cached; ~50–60% match, rest \"uncategorized\"); broader/narrower hierarchies |\n\
    | Graph/export | `rdf_graph_builder` · `networkx_adapter` | Turtle / RDF-XML / JSON-LD\
    \ + Vis.js JSON from one shared graph-building path; lightweight integrity validator |\n\
    | Analysis pipeline | `graph_analyzer` · `narrative_synthesizer` (offline) | 6 structural\
    \ analyses → markdown, then LLM-synthesized conservative/exploratory narratives for RAG\
    \ |\n| Deploy | Vercel (frontend) · Koyeb (backend) · MIT | ~12K lines of Python, ~30\
    \ package modules; pytest suite runs with no API keys or network |\n\nDeployed and functional\
    \ at v0.3.0 (April 2026). Production-ready for both single- and multi-résumé sessions\
    \ — the 0.3.0 release fixed the multi-résumé \"unknown nodes\" class of bugs (four root\
    \ causes, now covered by a 12-test regression suite), so two versions of the same résumé\
    \ collapse to one Person node with merged skills and jobs. Honest about its edges: DSPy\
    \ extraction is experimental and off by default; the semantic-integrity validator is a\
    \ pragmatic checklist, not full SHACL; the evaluation harness measures whatever output\
    \ you point it at rather than benchmarking the extractors themselves, and its ground-truth\
    \ tests skip until fixtures are authored; ESCO skill matching lands around 50–60%, with\
    \ vendor-specific tools expected to fall through as \"uncategorized.\" The pytest suite\
    \ is deliberately offline — no test needs an API key or network access. A live demo is\
    \ published at resume-graph-explorer.vercel.app."
  diagram_filename: resume_graph_explorer_diagram.png
  diagram_caption: Resume Graph Explorer — extraction → normalization → interactive graph
