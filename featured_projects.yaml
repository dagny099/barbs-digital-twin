- id: chronoscope
  title: ChronoScope
  summary: 'ChronoScope transforms documents into interactive timelines using AI event extraction:
    upload a resume, cover letter, or personal document, and OpenAI GPT (or a local Ollama
    model) identifies events, dates, locations, and people, which become an explorable Plotly
    Gantt chart and exportable TimelineJS web timeline. Built as a Streamlit app (Python 3.12)
    with a modular `chrono_scope` package — now the canonical app — whose six UI tabs are
    Timeline View, Event Editor, Export Studio, and Connections (working), plus Insights and
    Quality Check (still placeholders — the two unfinished tabs) — it performs strongest on
    standard chronological resumes, with experimental support for cover letters and personal
    statements, and keeps all documents and timeline data local. Self-hosted demo at chronoscope.barbhs.app
    (availability varies); full MkDocs documentation at docs.barbhs.com/chronoscope; currently
    v1.0 beta.'
  design_insight: 'ChronoScope is a study in choosing the right structural lens and the right
    architecture weight. Time as the organizing principle surfaces patterns a graph can''t
    (gaps, overlaps, momentum); a Python-only Streamlit stack — deliberately lighter than
    Resume Explorer''s Flask/React — keeps iteration fast while the modular package refactor
    keeps growth manageable. And the recent retirement of the original monolith — deleting
    the single-file app once the modular package could stand on its own, and recording exactly
    which features to harvest from git history rather than carrying dead code — is the same
    discipline at the maintenance level: keep the app honest about what''s actually built,
    with the unfinished Insights and Quality Check tabs marked as such instead of faked.'
  walkthrough_context: "An AI-powered document-to-timeline tool. Where a resume is a flat\
    \ list, ChronoScope unfolds the same material along a temporal axis — when things happened,\
    \ how they overlap, and what patterns emerge over time. It treats time as the primary\
    \ organizing principle: the same career data that Resume Graph Explorer models as a knowledge\
    \ graph (\"how do these skills and roles relate?\"), ChronoScope answers with \"when did\
    \ these things happen?\" Together the two projects demonstrate that the same source material\
    \ yields different insights depending on the structural lens applied — a core cognitive-science\
    \ idea.\n\n```\nUpload            resume / cover letter / personal statement (PDF, DOCX,\
    \ TXT)\n   │              PDF extraction uses a dual-library fallback (PyMuPDF + pdfplumber);\n\
    \   │              multi-document runs are deduplicated by file hash\n   ▼\nExtract  \
    \         OpenAI GPT or local Ollama identifies events, dates, locations, people\n   │\
    \              (best results on resumes; other document types are experimental);\n   │\
    \              vague dates (\"Fall 2010\") are normalized via a dateutil parsing pipeline\n\
    \   ▼\nValidate          quality checks flag missing data and assign confidence scores;\n\
    \   │              a gold-standard comparison framework supports accuracy measurement;\n\
    \   │              an editable data table lets users verify, rate, tag, and annotate events\n\
    \   ▼\nVisualize         interactive Plotly Gantt chart (zoom, pan, filter, tooltips);\n\
    \   │              beta knowledge-graph view of entity relationships (JSON-based, Neo4j\
    \ optional)\n   ▼\nExport            TimelineJS web timelines (6 color schemes, 10 font\
    \ combinations),\n                  plus Excel / JSON for downstream use\n```\n\nStreamlit\
    \ application, originally a rapid-iteration monolith, refactored (v0.8–0.9, late 2025)\
    \ into a proper Python package: `chrono_scope/` holds models (`TimelineEvent`), services\
    \ (document processing, timeline store), a provider-abstraction config (OpenAI + Ollama),\
    \ and six modular UI tab components with centralized session-state and widget-key management.\
    \ As of mid-2026 this modular app (`chrono_scope/ui/streamlit_app.py`) is the sole entry\
    \ point and the deployment target; the original single-file monolith was deleted (July\
    \ 2026), with the features still worth keeping — the full Insights and Quality Check tabs\
    \ — recorded for harvest from git history. The refactor preserved the deliberate contrast\
    \ with Resume Graph Explorer's decoupled Flask/React stack: ChronoScope stays Python-only\
    \ for fast iteration, but is no longer a single file.\n\n| Layer | Technology | Notes\
    \ |\n|---|---|---|\n| UI | Streamlit (6 modular tabs) | Timeline View, Event Editor, Export\
    \ Studio, Connections implemented; Insights + Quality Check are placeholders (full versions\
    \ in git history since the monolith was deleted) |\n| AI extraction | OpenAI GPT; Ollama\
    \ (local) | Provider abstraction in `chrono_scope/config/llm_providers.py` |\n| Document\
    \ processing | PyMuPDF + pdfplumber | Dual-library fallback for robust PDF text extraction\
    \ |\n| Visualization | Plotly (Gantt), NetworkX | Knowledge-graph view is JSON-based;\
    \ Neo4j optional |\n| Storage | Local JSON | Documents and timeline data never leave the\
    \ machine (extraction text goes to the chosen LLM provider) |\n| Export | TimelineJS,\
    \ openpyxl | Professional web timelines; Excel/JSON data export |\n| Docs & deploy | MkDocs\
    \ Material; Docker → Cloud Run | Live demo at chronoscope.barbhs.app |\n\nProduction-solid:\
    \ resume processing (the primary, best-tested document class), interactive timelines,\
    \ TimelineJS export, local-first storage, editable data table with tags/priority/feedback\
    \ fields. Beta / not yet built: the knowledge-graph (Connections) view is beta, and the\
    \ Insights and Quality Check tabs are still placeholders — the modular app's two unfinished\
    \ tabs, with prior versions preserved in git history after the monolith was deleted (July\
    \ 2026). Known limits: cover letters and personal statements extract noticeably less reliably\
    \ than resumes (experimental); scanned PDFs need external OCR; extremely vague dates (\"\
    recently\") may not extract; single-user, desktop-first. Cloud deployment (EC2 + Docker)\
    \ is now documented, but it is single-user with no authentication, so an instance should\
    \ be locked to your own IP. The demo is self-hosted, so availability depends on the server\
    \ being up."
  diagram_filename: chronoscope_diagram.png
  diagram_caption: ChronoScope — document upload → AI event extraction → validation → interactive
    timeline → export
  tags:
  - timeline
