- id: chronoscope
  title: ChronoScope
  summary: 'ChronoScope transforms documents into interactive timelines using AI event extraction:
    upload a resume, cover letter, or personal document, and OpenAI GPT (or a local Ollama
    model) identifies events, dates, locations, and people, which become an explorable Plotly
    Gantt chart and exportable TimelineJS web timeline. Built as a Streamlit app (Python 3.12)
    with a modular `chrono_scope` package — six specialized UI tabs covering timeline, data
    table, export, knowledge graph, analytics, and validation — it performs strongest on standard
    chronological resumes, with experimental support for cover letters and personal statements,
    and keeps all documents and timeline data local. Self-hosted demo at chronoscope.barbhs.app
    (availability varies); full MkDocs documentation at docs.barbhs.com/chronoscope; currently
    v1.0 beta.'
  design_insight: ChronoScope is a study in choosing the right structural lens and the right
    architecture weight. Time as the organizing principle surfaces patterns a graph can't
    (gaps, overlaps, momentum); a Python-only Streamlit stack — deliberately lighter than
    Resume Explorer's Flask/React — keeps iteration fast while the modular package refactor
    keeps growth manageable. The validation tab reflects a conviction that AI extraction features
    owe users a quality measurement, not just output.
  walkthrough_context: "An AI-powered document-to-timeline tool. Where a resume is a flat\
    \ list, ChronoScope unfolds the same material along a temporal axis — when things happened,\
    \ how they overlap, and what patterns emerge over time. It treats time as the primary\
    \ organizing principle: the same career data that Resume Graph Explorer models as a knowledge\
    \ graph (\"how do these skills and roles relate?\"), ChronoScope answers with \"when did\
    \ these things happen?\" Together the two projects demonstrate that the same source material\
    \ yields different insights depending on the structural lens applied — a core cognitive-science\
    \ idea.\n\n```\nUpload            resume / cover letter / personal statement (PDF, DOCX,\
    \ TXT)\n   │              PDF extraction uses a dual-library fallback (PyMuPDF + pdfplumber);\n\
    \   │              multi-document runs are deduplicated by file hash\n   ▼\nExtract  \
    \         OpenAI GPT or local Ollama identifies events, dates, locations, people\n   │\
    \              (best results on resumes; other document types are experimental);\n   │\
    \              vague dates (\"Fall 2010\") are normalized via a dateutil parsing pipeline\n\
    \   ▼\nValidate          quality checks flag missing data and assign confidence scores;\n\
    \   │              a gold-standard comparison framework supports accuracy measurement;\n\
    \   │              an editable data table lets users verify, rate, tag, and annotate events\n\
    \   ▼\nVisualize         interactive Plotly Gantt chart (zoom, pan, filter, tooltips);\n\
    \   │              beta knowledge-graph view of entity relationships (JSON-based, Neo4j\
    \ optional)\n   ▼\nExport            TimelineJS web timelines (6 color schemes, 10 font\
    \ combinations),\n                  plus Excel / JSON for downstream use\n```\n\nStreamlit\
    \ application, originally a rapid-iteration monolith, refactored (v0.8–0.9, late 2025)\
    \ into a proper Python package: `chrono_scope/` holds models (`TimelineEvent`), services\
    \ (document processing, timeline store), a provider-abstraction config (OpenAI + Ollama),\
    \ and six modular UI tab components with centralized session-state and widget-key management.\
    \ The refactor preserved the deliberate contrast with Resume Graph Explorer's decoupled\
    \ Flask/React stack: ChronoScope stays Python-only for fast iteration, but is no longer\
    \ a single file.\n\n| Layer | Technology | Notes |\n|---|---|---|\n| UI | Streamlit (6\
    \ modular tabs) | Timeline, Data Table, Export, Knowledge Graph, Analytics, Validation\
    \ |\n| AI extraction | OpenAI GPT; Ollama (local) | Provider abstraction in `chrono_scope/config/llm_providers.py`\
    \ |\n| Document processing | PyMuPDF + pdfplumber | Dual-library fallback for robust PDF\
    \ text extraction |\n| Visualization | Plotly (Gantt), NetworkX | Knowledge-graph view\
    \ is JSON-based; Neo4j optional |\n| Storage | Local JSON | Documents and timeline data\
    \ never leave the machine (extraction text goes to the chosen LLM provider) |\n| Export\
    \ | TimelineJS, openpyxl | Professional web timelines; Excel/JSON data export |\n| Docs\
    \ & deploy | MkDocs Material; Docker → Cloud Run | Live demo at chronoscope.barbhs.app\
    \ |\n\nProduction-solid: resume processing (the primary, best-tested document class),\
    \ interactive timelines, TimelineJS export, local-first storage, editable data table with\
    \ tags/priority/feedback fields. Beta: knowledge-graph view and advanced validation metrics.\
    \ Known limits: cover letters and personal statements extract noticeably less reliably\
    \ than resumes (experimental); scanned PDFs need external OCR; extremely vague dates (\"\
    recently\") may not extract; single-user, desktop-first. The demo is self-hosted, so availability\
    \ depends on the server being up."
