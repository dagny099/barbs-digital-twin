- id: academic-citation-platform
  title: Academic Citation Platform
  summary: Citation Compass (the project the twin also tracks as the Academic Citation Platform)
    is a research tool for **exploring academic citation networks and predicting likely citations**.
    It pairs an interactive Streamlit app with an analytics layer, an optional Neo4j graph
    backend, and a small machine-learning pipeline built on TransE knowledge-graph embeddings.
    You can import papers from Semantic Scholar, visualize how they cite one another, detect
    communities and centrality, track temporal trends, ask the model for top-K likely citations
    with confidence scores, and export the results as LaTeX tables and figures. It ships with
    a **demo mode** — a curated 13-paper offline dataset — so the whole thing runs with no
    database at all.
  design_insight: 'The core idea is to **treat the literature as a knowledge graph and citation
    prediction as a link-prediction problem**. Rather than matching papers by text similarity,
    it represents papers, authors, venues, and fields as nodes and citations as edges, then
    learns TransE embeddings over that graph — so "will paper A cite paper B?" becomes "is
    there a likely missing edge?", and the same vector space you query for predictions is
    one you can explore directly. The second idea is **consolidation onto one graph model**:
    three overlapping predecessor tools (knowledge cartography, citation mapping, citation
    prediction) collapse into a single platform where exploration, analytics, and prediction
    all read from the same representation instead of three drifting ones.'
  walkthrough_context: "A consolidation, and honest about being one. Citation Compass merges\
    \ three predecessor codebases — a knowledge-cartography tool, a citation-mapping tool,\
    \ and a citation-prediction system — into a single coherent platform, which is why it\
    \ spans exploration, analytics, and ML rather than doing one thing. Under the hood it\
    \ treats a citation corpus as a knowledge graph: papers, authors, venues, and research\
    \ fields are nodes, citations are edges, and a **TransE embedding model** (128-dimensional,\
    \ ~1.6M parameters) learns vector representations that let it score how likely one paper\
    \ is to cite another.\n\n```\nImport             pull paper metadata from Semantic Scholar\
    \ by keyword search,\n   │               paper-ID list, or file upload — with batching,\
    \ streaming\n   │               pagination, and progress tracking; or skip it entirely\
    \ and\n   │               load the curated 13-paper demo dataset (no database)\n   ▼\n\
    Graph              papers / authors / venues / fields become nodes and citations\n   │\
    \               become edges, held in an optional Neo4j backend (the demo\n   │      \
    \         path keeps a small graph in memory instead)\n   ▼\nLearn + analyze    a TransE\
    \ model (128-dim embeddings, ~1.6M params) scores\n   │               likely citations\
    \ for top-K prediction and embedding\n   │               exploration; an analytics service\
    \ computes community\n   │               detection (e.g. Louvain), centrality, and temporal\
    \ trends\n   ▼\nExplore + export   an interactive Streamlit app (network views, ML predictions,\n\
    \                   embedding explorer, visualizations) plus LaTeX-table, figure,\n  \
    \                 and summary export; a 4-notebook pipeline covers exploration\n     \
    \              → training → evaluation → presentation\n```\n\n| Layer | Technology | Notes\
    \ |\n|---|---|---|\n| UI | Streamlit (multi-page) | Home, Data Import, Demo Datasets,\
    \ ML Predictions, Embedding Explorer, Visualizations, Results, Analysis Pipeline |\n|\
    \ ML | PyTorch — TransE embeddings | 128-dim, ~1.6M-parameter trained checkpoint; top-K\
    \ citation prediction + embedding exploration |\n| Analytics | NetworkX + scikit-learn\
    \ | Community detection, centrality, temporal trend analysis |\n| Graph store | Neo4j\
    \ (optional) | Papers/authors/venues/fields as nodes, citations as edges; demo mode runs\
    \ without it |\n| Data import | Semantic Scholar API | Search / ID / file-upload import;\
    \ batching, streaming pagination, basic rate-limiting + caching |\n| Interfaces | `acp`\
    \ CLI + Python API + notebooks | CLI (health, db, ml, config); service getters; 4-notebook\
    \ exploration→training→evaluation→presentation |\n| Packaging | `pip install -e \".[all]\"\
    `; Docker / Cloud Run | Optional extras: ml / analytics / viz / web; MkDocs Material docs\
    \ site |\n\nConsolidated release (v0.1.0) drawn from three predecessor tools, with recent\
    \ work on deployment tooling (Docker / Cloud Run). Self-hosted; a demo is published at\
    \ cartography.barbhs.com (availability varies). Honest limits: full functionality needs\
    \ your own Neo4j instance (demo mode is deliberately small at 13 papers); citation-prediction\
    \ quality depends on the trained TransE checkpoint and the imported corpus; and the evaluation\
    \ figures in the notebooks are illustrative, not validated benchmarks."
